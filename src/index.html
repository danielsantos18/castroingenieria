<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Castros Ingeniería SAS — Materializa tus Ideas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Castros Ingeniería SAS — Experiencia comprobada en el diseño, planeación y ejecución de proyectos de construcción en Cartagena, Colombia."
  >
  <meta name="theme-color" content="#1f3a8a">
  <link rel="icon" type="image/png" href="images/brand/favicon.png">

  <!-- Aplica el tema guardado antes de pintar para evitar parpadeo (FOUC). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('castro-theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <!-- Preloader inicial: visible hasta que Angular arranca (ver main.ts). -->
  <div id="app-preloader" aria-hidden="true">
    <img src="images/brand/preloader.png" alt="Castros Ingeniería" width="100" height="100" />
  </div>
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #d8631b 0%, #c1282a 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #app-preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    #app-preloader img {
      width: 100px;
      height: auto;
      animation: app-preloader-bounce 2s infinite;
    }
    @keyframes app-preloader-bounce {
      from, 20%, 53%, to {
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
        transform: translate3d(0, 0, 0);
      }
      40%, 43% {
        animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
        transform: translate3d(0, -30px, 0);
      }
      70% {
        animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
        transform: translate3d(0, -15px, 0);
      }
      90% {
        transform: translate3d(0, -4px, 0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-preloader img { animation: none; }
    }
  </style>
  <app-root></app-root>
</body>
</html>
