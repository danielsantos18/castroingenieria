<header class="header" [class.header--scrolled]="scrolled()">
  <div class="container header__inner">
    <a class="header__brand" routerLink="/" aria-label="Inicio — Castro Ingeniería" (click)="closeMenu()">
      <img
        class="header__logo"
        src="images/brand/logo-banner.png"
        alt="Castros Ingeniería SAS"
        width="220"
        height="63"
      />
    </a>

    <nav
      id="primary-nav"
      class="header__nav"
      [class.is-open]="menuOpen()"
      aria-label="Navegación principal"
    >
      <ul class="header__menu">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              class="header__link"
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!--  <a class="btn btn--accent header__cta" [href]="'tel:+' + site.phoneRaw" (click)="closeMenu()">
        Conoce más
      </a>-->

    </nav>

    <div class="header__tools">
      <button
        class="header__theme"
        type="button"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
        (click)="themeService.toggle()"
      >
        @if (themeService.theme() === 'dark') {
          <!-- Sol -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1.4 1.4A1 1 0 1 1 5.63 7.04l-1.4-1.4a1 1 0 0 1 0-1.42zm12.72 12.72a1 1 0 0 1 1.42 0l1.4 1.4a1 1 0 0 1-1.41 1.42l-1.41-1.4a1 1 0 0 1 0-1.42zM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42l1.4-1.4a1 1 0 1 1 1.42 1.41l-1.4 1.41a1 1 0 0 1-1.42 0zM16.94 7.06a1 1 0 0 1 0-1.42l1.4-1.4a1 1 0 1 1 1.42 1.41l-1.4 1.41a1 1 0 0 1-1.42 0z" />
          </svg>
        } @else {
          <!-- Luna -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M21.64 13a1 1 0 0 0-1.05-.14 8 8 0 0 1-3.37.73 8 8 0 0 1-8-8 8 8 0 0 1 .73-3.37A1 1 0 0 0 8.36 1 10 10 0 1 0 22 14.66a1 1 0 0 0-.36-1.66z" />
          </svg>
        }
      </button>

      <button
        class="header__toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        aria-label="Abrir menú"
        (click)="toggleMenu()"
      >
        <span class="header__toggle-bar" [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</header>
